<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Agent - AI 电脑控制</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🖥️ Computer Agent</h1>
      <p>AI 驱动的电脑控制助手 - 基于 GPT-4o Vision</p>
    </header>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('control')">任务控制</button>
      <button class="tab-btn" onclick="switchTab('skills')">技能管理</button>
      <button class="tab-btn" onclick="switchTab('security')">安全设置</button>
      <button class="tab-btn" onclick="switchTab('history')">历史记录</button>
    </div>

    <!-- Tab Content: Control -->
    <div id="control-tab" class="tab-content active">
      <div class="main-content">
        <div class="panel">
          <h2><span>📝</span> 任务控制</h2>

          <div id="status" class="status idle">
            <span>⚪</span> 空闲 - 等待任务
          </div>

          <div class="input-group">
            <textarea id="taskInput" placeholder="输入你想让 AI 完成的任务...
例如：打开记事本并写一首诗"></textarea>
          </div>

          <div class="button-group">
            <button id="startBtn" class="btn btn-primary">
              <span>▶️</span> 开始执行
            </button>
            <button id="stopBtn" class="btn btn-danger" style="display: none;">
              <span>⏹️</span> 停止
            </button>
          </div>

          <div class="examples">
            <h3>示例任务：</h3>
            <button class="example-btn" onclick="app.modules.ui.setExample('打开记事本，写 Hello World')">打开记事本</button>
            <button class="example-btn" onclick="app.modules.ui.setExample('打开计算器，计算 123 + 456')">使用计算器</button>
            <button class="example-btn" onclick="app.modules.ui.setExample('打开浏览器，搜索 GitHub Copilot')">浏览器搜索</button>
            <button class="example-btn" onclick="app.modules.ui.setExample('打开文件管理器，创建一个新文件夹叫 test')">创建文件夹</button>
          </div>

          <div class="log-container" id="logContainer">
            <div class="log-entry">
              <span class="time">--:--:--</span>
              <span class="message">准备就绪，等待任务...</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2><span>🖼️</span> 屏幕预览</h2>

          <div class="screenshot-container" id="screenshotContainer">
            <span class="screenshot-placeholder">等待屏幕截图...</span>
          </div>

          <p class="help-text">
            当任务执行时，这里会显示 AI 看到的屏幕内容
          </p>
        </div>
      </div>
    </div>

    <!-- Tab Content: Skills -->
    <div id="skills-tab" class="tab-content">
      <div class="panel full-width">
        <div class="panel-header">
          <h2><span>📦</span> 技能管理</h2>
          <div class="button-group">
            <button id="refreshSkills" class="btn btn-secondary">
              <span>🔄</span> 刷新
            </button>
            <button class="btn btn-secondary" onclick="app.modules.skills.testSkillMatch()">
              <span>🔍</span> 测试匹配
            </button>
          </div>
        </div>

        <div id="skillsList" class="skills-list">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- Tab Content: Security -->
    <div id="security-tab" class="tab-content">
      <div class="main-content">
        <div class="panel">
          <div class="panel-header">
            <h2><span>🔒</span> 安全状态</h2>
            <div class="button-group">
              <button id="refreshSecurity" class="btn btn-secondary">
                <span>🔄</span> 刷新
              </button>
              <button class="btn btn-secondary" onclick="app.modules.security.toggleSecurity()">
                <span>🔀</span> 切换
              </button>
              <button class="btn btn-secondary" onclick="app.modules.security.showSecurityConfig()">
                <span>⚙️</span> 配置
              </button>
            </div>
          </div>

          <div id="securityStatus" class="security-status">
            <div class="loading">加载中...</div>
          </div>
        </div>

        <div class="panel">
          <h2><span>⚠️</span> 待确认操作</h2>

          <div id="confirmationsContainer" class="confirmations-container">
            <div class="empty-state">无待确认操作</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab Content: History -->
    <div id="history-tab" class="tab-content">
      <div class="panel full-width">
        <h2><span>📜</span> 任务历史</h2>

        <div id="historyContainer" class="history-container">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="api-client.js"></script>
  <script src="ui-manager.js"></script>
  <script src="skills-manager.js"></script>
  <script src="security-manager.js"></script>
  <script src="app.js"></script>
  <script src="tabs.js"></script>
</body>
</html>
